; Application PHP settings (loaded after php.ini-production)

; Errors go to the container log, never to the browser
display_errors = Off
log_errors = On
error_reporting = E_ALL
expose_php = Off

; Session cookies
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 7200
