name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# No paths: filters on purpose. A required check that is skipped never reports,
# and that would block merging forever.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: php -l on every first-party PHP file
        run: |
          docker run --rm -v "$PWD":/app:ro -w /app php:8.3-cli sh -c \
            'find . -name "*.php" -not -path "./vendor/*" -not -path "./email/phpmailer/*" -print0 | xargs -0 -n1 php -l > /dev/null'
      - run: docker compose config -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t ci-app .

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The single check to require in branch protection. Job renames above never break it.
  ci-gate:
    if: always()
    needs: [php, docker, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
